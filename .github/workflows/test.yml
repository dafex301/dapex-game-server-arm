name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  discord:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: discord
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: discord/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  watchdog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: bash -n scripts/*.sh monitoring/valheim-watchdog monitoring/install.sh monitoring/tests/run.sh
      - run: ./monitoring/tests/run.sh
